<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收費登記｜應用英語科學會</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#8b1a20">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
</head>
<body data-page="collect" class="collect-page">
  <main>
    <div class="page-banner collect-banner">
      <div class="wrap page-banner-inner">
        <p class="eyebrow">Officers only</p>
        <p class="banner-zh">幹部收費登記</p>
        <p id="collect-term">登入後開始收費</p>
      </div>
    </div>

    <div class="wrap collect">
      <section id="collect-signin" class="feedback collect-signin">
        <h2>請用幹部 Google 帳號登入</h2>
        <p class="feedback-intro">只有列在試算表「幹部」分頁的帳號可以使用。從 LINE 點開時，請先改用 Chrome 或 Safari 開啟。</p>
        <div id="signin-button" class="signin-button"></div>
        <p class="form-message" id="signin-message" role="status"></p>
      </section>

      <div id="collect-app" hidden>
        <div class="collect-officer">
          <p>經手人 <strong id="officer-name"></strong></p>
          <button type="button" class="text-button" id="signout">登出</button>
        </div>

        <section class="feedback collect-panel">
          <div class="collect-modes" role="tablist" aria-label="找人的方式">
            <button type="button" role="tab" data-mode="id" aria-selected="true">學號</button>
            <button type="button" role="tab" data-mode="scan" aria-selected="false">掃描</button>
            <button type="button" role="tab" data-mode="name" aria-selected="false">姓名</button>
            <button type="button" role="tab" data-mode="class" aria-selected="false">班級</button>
          </div>

          <div class="collect-mode" data-panel="id">
            <form id="id-form" class="paycheck-input" novalidate>
              <input id="collect-id" type="text" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="輸入學號" aria-label="學號" aria-describedby="collect-error">
              <button class="button button-navy" type="submit">查詢</button>
            </form>
            <p class="field-error" id="collect-error" hidden>請輸入 5 到 10 位數字的學號。</p>
          </div>

          <div class="collect-mode" data-panel="scan" hidden>
            <div id="scanner" class="collect-scanner"></div>
            <p class="collect-hint" id="scan-hint">把學生證條碼對準框線，掃到後會自動顯示。</p>
          </div>

          <div class="collect-mode" data-panel="name" hidden>
            <input id="collect-name" class="collect-text" type="search" autocomplete="off" placeholder="輸入姓名，例如 王小明" aria-label="姓名">
          </div>

          <div class="collect-mode" data-panel="class" hidden>
            <select id="collect-class" class="collect-text" aria-label="班級"></select>
            <label class="collect-toggle"><input type="checkbox" id="unpaid-only" checked> 只顯示未繳</label>
          </div>

          <div id="collect-result" class="paycheck-result" aria-live="polite"></div>
          <ul id="collect-list" class="collect-people"></ul>
        </section>

        <section class="collect-today" aria-labelledby="today-title">
          <div class="collect-today-head">
            <h2 id="today-title">今日收款</h2>
            <button type="button" class="text-button" id="today-refresh">重新整理</button>
          </div>
          <div class="collect-stats" id="today-stats"></div>
          <ul class="collect-list" id="today-list"></ul>
        </section>
      </div>
    </div>
  </main>

  <div class="collect-toasts" id="toasts" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/collect.js"></script>
</body>
</html>
