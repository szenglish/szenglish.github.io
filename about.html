<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>關於我們｜應用英語科學會</title>
  <meta name="description" content="認識樹人醫專應用英語科學會的核心價值、領導團隊與各部門。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+TC:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about">
  <main>
    <div class="page-banner">
      <div class="wrap page-banner-inner">
        <h1 lang="en">About Us</h1>
        <p class="banner-zh">關於我們</p>
      </div>
    </div>

    <nav class="sub-nav" aria-label="本頁區塊">
      <div class="wrap">
        <a href="#intro">科學會簡介</a>
        <a href="#values">核心價值</a>
        <a href="#leadership">領導團隊</a>
        <a href="#departments">執行部門</a>
      </div>
    </nav>

    <section class="wrap section about-intro" id="intro">
      <div class="title-block"><h2 class="display-heading" lang="en">Who We Are</h2><p class="heading-zh">科學會簡介</p></div>
      <div>
        <p class="about-lead">我們是樹人醫專應用英語科的學生自治組織，為同學發聲，也為同學創造舞台。</p>
        <p>科學會透過研習與常務會議提升學生自治精神、維護同學的福利與權益，並舉辦節慶、迎新、送舊與英語專題等活動，讓每位應英科同學都能在校園裡找到屬於自己的位置。</p>
      </div>
    </section>

    <section class="section values" id="values">
      <div class="wrap values-layout">
        <div class="title-block"><h2 class="display-heading" lang="en">Our Values</h2><p class="heading-zh">核心價值</p></div>
        <p class="hero-slogan values-slogan" aria-label="團結、責任、勇敢、熱忱、創新">
          <span aria-hidden="true"><b>Unity</b><small>團結</small></span>
          <span aria-hidden="true"><b>Responsibility</b><small>責任</small></span>
          <span aria-hidden="true"><b>Courage</b><small>勇敢</small></span>
          <span aria-hidden="true"><b>Passion</b><small>熱忱</small></span>
          <span aria-hidden="true"><b>Innovation</b><small>創新</small></span>
        </p>
      </div>
    </section>

    <section class="wrap section" id="leadership">
      <div class="section-head">
        <div class="title-block"><h2 class="display-heading" lang="en">Leadership</h2><p class="heading-zh">領導團隊</p></div>        <div class="year-filter term-filter" id="term-filter" role="group" aria-label="依屆別篩選" hidden></div>
      </div>
      <div id="leadership-list">
        <div class="skeleton-row skeleton-tall" role="status" aria-label="幹部資料載入中"><span class="skeleton"></span><span class="skeleton"></span></div>
      </div>
    </section>

    <section class="section departments" id="departments">
      <div class="wrap">
        <div class="title-block"><h2 class="display-heading" lang="en">Departments</h2></div>
        <div id="department-list"></div>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="js/site.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
